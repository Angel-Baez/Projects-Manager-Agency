version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pma_user
      POSTGRES_PASSWORD: pma_password
      POSTGRES_DB: pma_db
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pma_user -d pma_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pma-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
